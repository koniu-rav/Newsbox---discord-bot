version: '3.8'

services:
  newsbox-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newsbox-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
    volumes:
      # Persistent storage: survive restarts, container recreations, and updates
      - ./data:/app/data
      - ./prompts:/app/prompts
      - ./logs:/app/logs
