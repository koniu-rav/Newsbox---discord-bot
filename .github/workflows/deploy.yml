name: Deploy Newsbox Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: SSH to VPS & Rebuild Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            if [ -d "$HOME/Newsbox---discord-bot" ]; then
              cd "$HOME/Newsbox---discord-bot"
            elif [ -d "/root/Newsbox---discord-bot" ]; then
              cd "/root/Newsbox---discord-bot"
            fi
            echo "Working directory: $(pwd)"
            git pull origin main
            if [ -f .env ]; then
              sed -i 's/GEMINI_MODEL=gemini-3.5-flash-lite/GEMINI_MODEL=gemini-3.7-flash/' .env
              sed -i 's/GEMINI_MODEL=gemini-1.5-flash/GEMINI_MODEL=gemini-3.7-flash/' .env
              sed -i 's/GEMINI_MODEL=gemini-2.0-flash/GEMINI_MODEL=gemini-3.7-flash/' .env
            fi
            sudo docker compose up -d --build
